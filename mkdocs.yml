site_name: FiniteFree
site_description: Finite Free Probability Library
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."] # Specifies the module search path
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - API Reference: api.md
