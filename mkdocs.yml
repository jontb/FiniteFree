site_name: FiniteFree
site_description: Finite free probability with reusable numerical workflows, controlled precision and reproducible sampling
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."] # Specifies the module search path
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - API Reference: api.md
  - Tutorial: tutorial.md
  - Multivariate Workflows: multivariate.md
  - GUE Spectral Workflow: gue-workflow.md
  - Development: development.md
  - Feature Roadmap: roadmap.md
  - Implementation Packets:
      - Overview: implementation-packets.md
      - Phase 0:
          - P00 Baseline: packets/p00-baseline.md
          - P00 Evidence Report: p00-baseline-report.md
      - Phase 1:
          - P01 Exact Moments: packets/p01-exact-moments.md
          - P01 Scope Proposal: p01-scope.md
          - P02 Inverse Finite R: packets/p02-inverse-finite-r.md
          - P02 Scope Proposal: p02-scope.md
          - P03 Beta Hermite: packets/p03-beta-hermite.md
          - P03 Scope Proposal: p03-scope.md
          - P04 Beta Laguerre: packets/p04-beta-laguerre.md
          - P16 Existing Empirical Transforms: packets/p16-empirical-legacy-transforms.md
      - Phase 2:
          - P05 Rectangular Convolution: packets/p05-rectangular-convolution.md
          - P06 Rectangular Cumulants: packets/p06-rectangular-cumulants.md
          - P07 Jacobi MANOVA: packets/p07-jacobi-manova.md
  - Numerical Benchmark Plan: benchmark-plan.md
  - Code Map: code-map.md
  - Contributing: https://github.com/jontb/FiniteFree/blob/develop/CONTRIBUTING.md
  - Release Process: release.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
