site_name: FiniteFree
site_description: Finite free probability with reusable numerical workflows, controlled precision and reproducible sampling
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."] # Specifies the module search path
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - API Reference: api.md
  - Tutorial: tutorial.md
  - Multivariate Workflows: multivariate.md
  - GUE Spectral Workflow: gue-workflow.md
  - Development: development.md
  - Numerical Benchmark Plan: benchmark-plan.md
  - Code Map: code-map.md
  - Contributing: https://github.com/jontb/FiniteFree/blob/develop/CONTRIBUTING.md
  - Release Process: release.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
