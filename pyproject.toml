[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finitefree"
version = "0.1.0"
description = "A Python library for exact finite free probability"
authors = [
    { name = "Author" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "python-flint>=0.6.0",
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["finitefree"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "flint.*",
    "scipy.*",
    "sympy.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = []
