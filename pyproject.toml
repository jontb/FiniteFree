[build-system]
requires = ["hatchling", "hatch-cython", "Cython", "numpy"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
directives = {boundscheck = false, wraparound = false, nonecheck = false, cdivision = true, language_level = 3}

[tool.hatch.build.targets.wheel.hooks.cython.options.files]
exclude = ["**/*.py", "*.py"]

[tool.setuptools]
packages = ["finitefree"]


[project]
name = "finitefree"
version = "0.1.0"
description = "A Python library for exact finite free probability"
authors = [
    { name = "Author" }
]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "python-flint>=0.6.0",
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.3.0"
]
[tool.hatch.build.targets.wheel]
packages = ["finitefree"]
pure = false

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    '^scratch/',
    '^experiments/',
    '^visuals/'
]

[[tool.mypy.overrides]]
module = [
    "flint.*",
    "scipy.*",
    "sympy.*",
    "matplotlib.*",
    "finitefree.utils.modular_fast"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["scratch"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = ["E501", "E402"]

[tool.cibuildwheel]
# Skip PyPy wheels and 32-bit builds
skip = ["pp*", "*-manylinux_i686", "*-musllinux_i686", "*-win32"]
# Build 64-bit architectures
archs = ["auto64"]

[tool.cibuildwheel.macos]
# Disable delocate-wheel repair since we do not vendor any external dynamically linked libraries
repair-wheel-command = ""


