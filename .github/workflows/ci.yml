name: FiniteFree CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libflint-dev libgmp-dev libmpfr-dev

    - name: Install System Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install flint gmp mpfr
        echo "C_INCLUDE_PATH=/opt/homebrew/include" >> $GITHUB_ENV
        echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Force pre-compiled wheels for python-flint >= 0.6.0 on Windows, fallback on others
        python -m pip install --only-binary=python-flint "python-flint>=0.6.0" || python -m pip install "python-flint>=0.6.0"
        # Standard install (not editable) ensures Cython modules compile and link properly
        pip install .[dev]

    - name: Verify Code Formatting & Linting (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m ruff format --check finitefree/ tests/
        python -m ruff check finitefree/ tests/
        python -m mypy finitefree/ tests/

    - name: Test with pytest and coverage (Cython Enabled)
      run: |
        # Compile Cython module in-place so it is available locally in the source tree, including NumPy headers
        python -m pip install Cython
        python -c "from setuptools import setup, Extension; from Cython.Build import cythonize; import numpy as np; setup(ext_modules=cythonize(Extension('finitefree.utils.modular_fast', ['finitefree/utils/modular_fast.pyx'], include_dirs=[np.get_include()])), script_args=['build_ext', '--inplace'])"
        export PYTHONPATH=.
        python -m pytest --import-mode=importlib --cov=finitefree --cov-report=xml tests/

    - name: Test with pytest (Cython Disabled Fallback)
      env:
        PYFFP_DISABLE_CYTHON: "1"
      run: |
        export PYTHONPATH=.
        python -m pytest --import-mode=importlib tests/

    - name: Mark workspace as safe directory (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        git config --global --add safe.directory "${{ github.workspace }}"

    - name: Upload coverage to Codecov (Linux only)
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_safe_directory: true
