name: FiniteFree CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "maintenance/**" ]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libflint-dev libgmp-dev libmpfr-dev

    - name: Install System Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        if command -v brew &> /dev/null; then
          brew install flint gmp mpfr
          echo "C_INCLUDE_PATH=/opt/homebrew/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
        elif command -v apt-get &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y libflint-dev libgmp-dev libmpfr-dev
        fi

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Prefer pre-compiled python-flint wheels on every platform.
        python -m pip install --only-binary=python-flint "python-flint>=0.9.0" || python -m pip install "python-flint>=0.9.0"
        # Standard install (not editable) ensures Cython modules compile and link properly
        pip install .[dev]

    - name: Verify Code Formatting & Linting (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m ruff format --check finitefree/ tests/ scripts/ examples/
        python -m ruff check finitefree/ tests/ scripts/ examples/
        python -m mypy finitefree/ tests/ scripts/ examples/

    - name: Test with pytest and coverage (Cython Enabled)
      run: |
        # Compile Cython module in-place so it is available locally in the source tree, including NumPy headers
        python -m pip install Cython
        python -c "from setuptools import setup, Extension; from Cython.Build import cythonize; import numpy as np; setup(ext_modules=cythonize(Extension('finitefree.utils.modular_fast', ['finitefree/utils/modular_fast.pyx'], include_dirs=[np.get_include()])), script_args=['build_ext', '--inplace'])"
        export PYTHONPATH=.
        python -m pytest --import-mode=importlib --cov=finitefree --cov-report=xml tests/

    - name: Test with pytest (Cython Disabled Fallback)
      env:
        PYFFP_DISABLE_CYTHON: "1"
      run: |
        export PYTHONPATH=.
        python -m pytest --import-mode=importlib tests/

    - name: Verify documentation examples
      run: |
        python scripts/check_readme_examples.py
        PYTHONPATH=. python examples/showcase.py

    - name: Test documentation tools
      run: python -m pytest --import-mode=importlib scripts/tests/

    - name: Build documentation strictly
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: |
        python -m pip install mkdocs-material "mkdocstrings[python]"
        python scripts/sync_docs.py
        git diff --exit-code -- docs/index.md
        python -m mkdocs build --strict

    - name: Test installed wheel outside the source tree
      run: |
        # The standard installation above built a wheel. Test that installed
        # package with no source checkout on the import path.
        unset PYTHONPATH
        python scripts/test_installed_wheel.py

    - name: Mark workspace as safe directory (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        git config --global --add safe.directory "${{ github.workspace }}"

    - name: Upload coverage to Codecov (Linux only)
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_safe_directory: true

  minimum:
    name: Ubuntu / Python 3.10 / minimum runtime dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install pinned runtime and build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --only-binary=python-flint -r requirements/minimum-runtime.txt
        python -m pip install "pytest==7.0.0" hatchling hatch-cython Cython "setuptools<77" wheel build
        python -m pip install --no-deps --no-build-isolation .
        python -m pip check
    - name: Build source extension with the minimum NumPy headers
      run: |
        python -c "from setuptools import setup, Extension; from Cython.Build import cythonize; import numpy as np; setup(ext_modules=cythonize(Extension('finitefree.utils.modular_fast', ['finitefree/utils/modular_fast.pyx'], include_dirs=[np.get_include()])), script_args=['build_ext', '--inplace'])"
    - name: Test compiled and fallback paths
      run: |
        PYTHONPATH=. python -m pytest --import-mode=importlib tests/ scripts/tests/
        PYFFP_DISABLE_CYTHON=1 PYTHONPATH=. python -m pytest --import-mode=importlib tests/ scripts/tests/
    - name: Verify examples and installed wheel
      run: |
        python scripts/check_readme_examples.py
        PYTHONPATH=. python examples/showcase.py
        python scripts/test_installed_wheel.py

  artifacts:
    name: Build release candidate wheel and sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: python -m pip install build
    - run: python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: finitefree-release-candidate
        path: dist/*
        if-no-files-found: error
