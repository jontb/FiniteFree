name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release version and destination
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ steps.plan.outputs.destination }}
      repository_url: ${{ steps.plan.outputs.repository_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - name: Check static version before building
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TESTPYPI: ${{ github.event.inputs.publish_to_testpypi || 'true' }}
        run: python -m scripts.release_preflight --event "$RELEASE_EVENT" --ref "$RELEASE_REF" --testpypi "$RELEASE_TESTPYPI" --github-output "$GITHUB_OUTPUT"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: preflight
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3

      - name: Set up Python for archive checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify wheel extension inventories
        run: python scripts/check_wheel_contents.py wheelhouse

      - name: Upload compiled wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate_artifacts:
    name: Validate release archives and hashes
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging twine
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - run: python -m scripts.check_release_artifacts dist --expected-wheels 16 --require-sdist --manifest dist/artifact-manifest.json
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            dist/artifact-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish packages to PyPI
    needs: [preflight, validate_artifacts]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing / OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - name: Download distribution archives
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Download reviewed manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: verification
      - name: Verify upload bytes match the validated archives
        run: python -m scripts.check_release_artifacts dist --expected-wheels 16 --require-sdist --verify verification/artifact-manifest.json
      - name: Publish to selected package index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ needs.preflight.outputs.repository_url }}
          skip-existing: ${{ needs.preflight.outputs.destination == 'testpypi' }}
