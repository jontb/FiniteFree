name: Deploy MkDocs Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Stable documentation follows main, including manual workflow runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision C toolchains and arbitrary-precision libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgmp-dev libmpfr-dev libflint-dev

      - name: Initialize Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Execute local package installation and compile Cython extensions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Force pre-compiled wheels for python-flint, fallback on source
          python -m pip install --only-binary=python-flint "python-flint>=0.9.0" || python -m pip install "python-flint>=0.9.0"
          pip install -e ".[dev]"
          pip install mkdocs-material mkdocstrings[python]

      - name: Construct static documentation assets
        run: |
          PYTHONPATH=. python examples/interactive_geometry.py --output docs/visuals/interactive
          OPENBLAS_NUM_THREADS=1 PYTHONPATH=. python examples/spectral_dashboards.py --output docs/visuals/interactive
          python scripts/sync_docs.py
          git diff --exit-code -- docs/index.md
          python scripts/check_readme_examples.py
          mkdocs build --strict

      - name: Configure GitHub Pages environment
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload compiled artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Execute deployment
        id: deployment
        uses: actions/deploy-pages@v4
