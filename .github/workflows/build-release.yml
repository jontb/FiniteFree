name: Build Release Artifacts Only

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/build-release.yml"
      - ".github/workflows/publish.yml"
      - "pyproject.toml"
      - "finitefree/**"
      - "tests/**"
      - "scripts/test_installed_wheel.py"
      - "scripts/build_flint_musllinux.sh"
      - "scripts/clean_wheel_extensions.py"
      - "scripts/check_wheel_contents.py"
      - "scripts/check_release_artifacts.py"
      - "scripts/release_preflight.py"
  push:
    # A branch pointing to reviewed main runs the matrix on that exact commit.
    # Branch pushes never match publish.yml's release-tag trigger.
    branches: ["release-review/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the publishing wheel policy
        # Shared Python, architecture, skip and installed-wheel test policy
        # comes from pyproject.toml, using the same action as publish.yml.
        uses: pypa/cibuildwheel@v2.21.3
      - name: Set up Python for archive checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify wheel extension inventories
        run: python scripts/check_wheel_contents.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build release source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate_artifacts:
    name: Verify release archive contents and manifest
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging twine
      - uses: actions/download-artifact@v4
        with:
          pattern: release-review-*
          path: dist
          merge-multiple: true
      - run: python -m scripts.check_release_artifacts dist --expected-wheels 16 --require-sdist --manifest dist/artifact-manifest.json
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-review-manifest
          path: |
            dist/artifact-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
